services:
  app:
    build: .
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
    volumes:
      - ./options.json:/app/options.json:ro
      - ./logs:/app/logs
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: resistance
      POSTGRES_USER: resistance_user
      POSTGRES_PASSWORD: resistance_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./misc/recreatedb_pg.sql:/docker-entrypoint-initdb.d/01-recreatedb.sql:ro
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  postgres_data: